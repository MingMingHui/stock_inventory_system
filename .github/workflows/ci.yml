name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (no Supabase credentials needed to verify the build)
        run: npm run build

  database:
    name: Database — migrations, RLS, calculations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Run database and Python tests
        working-directory: python
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # The workbook is git-ignored, so Excel data tests are skipped here;
        # run them locally before importing (see docs/data-import.md).
        run: pytest -q
