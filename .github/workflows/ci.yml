name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (no Supabase credentials needed to verify the build)
        run: npm run build

  edge-functions:
    name: Edge Functions — Deno type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Bot logic is unit-tested by `npm test`; this checks the Deno entry point.
      # --node-modules-dir=none: resolve npm/jsr packages from Deno's cache (as the
      # Supabase runtime does) instead of the repo's npm node_modules, which this
      # job does not install.
      - run: deno check --node-modules-dir=none supabase/functions/telegram-webhook/index.ts

  database:
    name: Database — migrations, RLS, calculations, Telegram, analytics
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17  # same major version as the Supabase project
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Run database and Python tests
        working-directory: python
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # The workbook is git-ignored, so Excel data tests are skipped here;
        # run them locally before importing (see docs/data-import.md).
        run: pytest -q
